---
- name: Redeploy Claims Demo integration API appsettings
  hosts: claims_demo_api:&windows
  gather_facts: true
  serial: "{{ deploy_parallelism | default('25%') }}"
  any_errors_fatal: true

  roles:
    - role: integrations/claims_demo_api
      when:
        - redeploy_appsettings_claims_demo_api is defined
